# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# The latest NeoForge versions are available at: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must match the NeoForge version for a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# NeoForge version (must match Minecraft version)
neo_version=21.1.113
neo_version_range=[21.1.113,)

# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Mod Properties
mod_id=dreadsteel
mod_name=Dreadsteel
mod_license=All Rights Reserved
mod_version=1.21.1-1.1.9
mod_group_id=net.mindoth
mod_authors=Code by Mindoth
mod_description=NIGHTMARE NIGHTMARE NIGHTMARE NIGHTMARE

# Archive Properties
archives_base_name=dreadsteel